# Preguntas frecuentes que el agente responde con texto fijo, sin inventar.
faq:
  - pregunta: "¿Qué tipo de rol te interesa?"
    respuesta: >
      Roles donde la IA tenga que operar sobre sistemas que ya existen, con datos
      reales y consecuencias reales, no pilotos aislados. Me interesa
      especialmente el tramo de piloto a producción, que es donde la mayoría de
      los proyectos de IA se detienen, y es justo el tramo en el que he trabajado
      los últimos años.
  - pregunta: "¿Cuál es tu expectativa salarial?"
    respuesta: >
      Ese punto prefiero conversarlo directamente con el equipo de reclutamiento,
      no a través de este agente.
  - pregunta: "¿Cuál ha sido tu error técnico más caro y qué aprendiste?"
    respuesta: >
      Una deriva de intereses en una plataforma financiera: un incremento atómico
      se aplicaba sobre un saldo que un batch nocturno ya había puesto en cero.
      El bug era invisible por unidad y sólo aparecía al auditar el agregado.
      Desde entonces cualquier cálculo financiero que escribo lleva una auditoría
      que compara el agregado contra una fuente externa, no sólo pruebas
      unitarias sobre el caso feliz.

resumen: >
  Ingeniero en Inteligencia Artificial por el IPN, con publicación arbitrada en
  NLP. Mi trabajo es llevar sistemas de IA a producción y sostenerlos ahí. Hoy
  soy responsable técnico de las soluciones de IA generativa en producción de un
  grupo automotriz: arquitectura de tool calling contra los sistemas del negocio,
  gestión de contexto y memoria para conversaciones de varios días, escalamiento
  a humano, y toda la capa que los mantiene vivos, que es suite de evaluación
  anclada en modos de falla reales, pruebas de regresión ante cada cambio,
  trazabilidad y medición de costo y latencia por interacción. También construí
  las plataformas web que hacen auditable esa operación: mini CRMs por línea de
  negocio donde una persona revisa, valida, aprueba y corrige lo que el agente
  produce. Y la parte determinista: los procesos que exigen reproducibilidad
  contable no pasan por un modelo.


proyectos:
  - id: "proy-cv-agent"
    nombre: "Agente de CV (este mismo agente)"
    resumen: >
      Servidor propio compatible con la especificación Open Responses que
      expone este CV como agente conversacional, con herramientas, guardarraíles
      y suite de evaluación automatizada.
    detalle: >
      Implementa POST /v1/responses en modo síncrono y streaming SSE, ejecuta un
      agent loop con herramientas server-side sobre el perfil, cede control al
      cliente cuando este declara sus propias function tools, y corre una batería
      de evals de fundamentación (groundedness) en CI antes de cada despliegue.
    stack: ["Python", "FastAPI", "SSE", "Docker", "Cloud Run", "GitHub Actions"]
    repo: ""   # VERIFICA: pega la URL del repo público

  - id: "proy-bot-ventas"
    nombre: "Bot de ventas conversacional en WhatsApp"
    resumen: >
      Sistema multiagente que atiende leads entrantes de venta de autos de punta
      a punta, desde el primer mensaje hasta la cita agendada en el CRM.
    detalle: >
      Arquitectura de agente orquestador con subagentes especializados
      (búsqueda de inventario, valuación, agendamiento). El aprendizaje central
      fue mover toda decisión que debe ser exacta (horarios, precios,
      disponibilidad) fuera del LLM hacia nodos deterministas, dejando al modelo

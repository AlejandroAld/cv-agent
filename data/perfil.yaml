proyectos:
  # Trabajo realizado dentro de Grupo Dalton. Se listan aparte para poder
  # detallar la arquitectura sin inflar la historia laboral.
  - id: "proy-agentes-whatsapp"
    nombre: "Suite de agentes conversacionales sobre WhatsApp Business API"
    resumen: >
      Cuatro agentes con tráfico real de clientes que no solo responden: ejecutan
      acciones contra los sistemas del negocio.
    detalle: >
      Arquitectura single-agent de tool calling sobre n8n autohospedado en
      Kubernetes, con Claude vía la API de Anthropic desplegada en Azure AI
      Foundry. Gestión de contexto y memoria en tres capas para conversaciones de
      varios días, con presupuesto explícito de ventana de contexto. Persistencia
      heterogénea por agente sobre Azure Database for PostgreSQL, Azure Cosmos DB
      y Firestore, con Redis en los cuatro para control de concurrencia por
      conversación. El criterio de diseño central fue sacar del modelo toda
      decisión que debe ser exacta y dejarla en nodos deterministas, y dejarle al
      modelo la comprensión del lenguaje y la conducción de la conversación.
    stack: ["Claude vía API de Anthropic sobre Azure AI Foundry", "n8n", "Kubernetes", "WhatsApp Business API", "PostgreSQL", "Azure Cosmos DB", "Firestore", "Redis"]

  - id: "proy-plataformas-supervision"
    nombre: "Plataformas web de supervisión y control de agentes"
    resumen: >
      Mini CRMs internos por línea de negocio, en producción con usuarios reales,
      que le dan a una persona el control sobre lo que el agente hace: revisar,
      validar, aprobar y corregir antes de que la salida tenga efecto.
    detalle: >
      Son la capa de human-in-the-loop de la operación de agentes. Cada
      plataforma expone la cola de lo que el agente produjo, con revisión,
      aprobación, corrección y trazabilidad de quién aprobó qué y cuándo, de modo
      que cada decisión del sistema queda auditable por una persona del negocio y
      no sólo por logs de ingeniería. El criterio de diseño es el mismo que rige
      toda la arquitectura: el modelo produce un borrador, la persona decide.
      Construidas sobre Next.js y Firebase, con RBAC y matriz de permisos por
      módulo y despliegue a producción bajo verificación previa a cada paso
      irreversible. Soy responsable de toda la infraestructura: n8n, secretos,
      webhooks, IAM y configuración en entornos separados de desarrollo y
      producción, con flujo de ramas y despliegue automático por merge.
    stack: ["Next.js", "TypeScript", "Firebase (Firestore, Auth, App Hosting)", "n8n", "Google Secret Manager"]
    repo: ""

  - id: "proy-motor-financiero"
    nombre: "Motor determinista de cálculo financiero"
    resumen: >
      Software financiero en producción, deliberadamente basado en reglas y no en
      modelo, por requerimiento de reproducibilidad y auditoría.
    detalle: >
      Máquina de estados finita determinista sobre Cloud Functions: cálculo
      periódico de intereses con convención bancaria de base 360 e historial
      auditable, sincronización con ERP, disparadores de pago y generación de
      documentos firmados digitalmente, sobre PostgreSQL y SQL Server. Toma tasa
      de referencia desde la API pública de Banxico y respeta calendario de días
      hábiles. La lección de arquitectura fue que cualquier cálculo financiero
      necesita una auditoría que compare el agregado contra una fuente externa, no
      sólo pruebas unitarias sobre el caso feliz.
    stack: ["Firebase Cloud Functions", "Firestore", "TypeScript", "PostgreSQL", "SQL Server", "n8n", "API de Banxico"]
    repo: ""

  - id: "proy-saas-flotillas"
    nombre: "SaaS multi-tenant de administración de flotillas"
    resumen: >
      Plataforma multi-tenant con aislamiento por tenant y RBAC jerárquico.
    detalle: >
      Arquitectura multi-tenant con aislamiento por middleware de contexto de
      tenant. RBAC jerárquico con perfiles de visibilidad a nivel campo, roles en
      árbol y matriz de permisos por módulo y acción. Construido sobre Next.js
      con App Router, TypeScript en modo estricto y validación de esquemas con
      Zod.
    stack: ["Next.js (App Router)", "TypeScript", "Firebase", "Cloud Functions", "Zod", "Tailwind", "Radix UI"]
    repo: ""

  - id: "proy-migracion-web"
    nombre: "Migración de sitio público de Angular 9 a Next.js 15"
    resumen: >
      Migración de un sitio con SSR a Next.js 15 con App Router, conectando APIs
      reales de backend .NET a través de una capa de gestión de APIs.
    detalle: >
      PageSpeed subió de 34 a 96 y el LCP bajó de 8.3 s a 2.5 s. Establecí un
      patrón BFF donde el navegador sólo llama route handlers internos y las API
      keys viven exclusivamente del lado servidor, con verificación automatizada
      de que ninguna llave se filtre al bundle, más un check de SEO en CI que
      corre en cada pull request que toca la aplicación.
    stack: ["Next.js 15", "TypeScript", "Azure APIM", ".NET (consumo de APIs)", "Cosmos DB"]
    repo: ""

  - id: "proy-cv-agent"
    nombre: "Agente de CV (este mismo agente)"
    resumen: >
      Servidor propio compatible con la especificación Open Responses que expone
      este perfil como agente conversacional.
    detalle: >
      Implementa POST /v1/responses en modo síncrono y streaming SSE, ejecuta un
      agent loop con herramientas server-side sobre el perfil, cede control al
      cliente cuando este declara sus propias function tools, y corre una batería
      de evals de fundamentación en CI antes de cada despliegue. En construcción.
    stack: ["Python", "FastAPI", "SSE", "Docker", "Azure Container Apps", "GitHub Actions"]
    repo: "https://github.com/AlejandroAld/cv-agent"

  - id: "proy-cotizador"
    nombre: "Flujo de valuación vehicular"
    resumen: >
      Agente de compra y valuación dentro de la suite conversacional: entrega a
      un vendedor particular un rango de precio para su auto y convierte la
      conversación en una cita.
    detalle: >
      El cálculo de valuación vive fuera del modelo, en lógica determinista, por
      la misma razón que el resto de los cálculos exactos del sistema: un rango
      de precio equivocado es un problema de negocio, no un detalle de
      conversación.
    stack: ["n8n", "PostgreSQL", "Next.js"]


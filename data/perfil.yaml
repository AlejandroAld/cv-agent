# El agente NO puede afirmar nada que no esté en este archivo.
#
# CRITERIO DE ESTE ARCHIVO: sustancia técnica y resultados medibles.
# Sí se incluyen métricas relativas sobre trabajo propio (mejoras, adopción,
# rendimiento) porque son lo que hace verificable un logro.

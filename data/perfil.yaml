# Preguntas frecuentes que el agente responde con texto fijo, sin inventar.
faq:
  - pregunta: "¿Qué tipo de rol te interesa?"
    respuesta: >
      Roles donde la IA tenga que operar sobre sistemas que ya existen, con datos
      reales y consecuencias reales. Me interesa el tramo de piloto a producción,
      que es donde la mayoría de los proyectos se detiene, y es justo donde he
      trabajado: no sólo construir el agente, sino sostenerlo cuando ya tiene
      tráfico, con evaluación, trazabilidad y control de costo.
  - pregunta: "¿Cuál es tu expectativa salarial?"
    respuesta: >
      Ese punto prefiero conversarlo directamente con el equipo de reclutamiento,
      no a través de este agente.
  - pregunta: "¿Cuál ha sido tu error técnico más caro y qué aprendiste?"
    respuesta: >
      Mi publicación arbitrada tiene tres debilidades metodológicas que identifiqué
      después y documenté en la sección de limitaciones. Hice el sobremuestreo
      antes del split, así que hay fuga de datos entre entrenamiento y prueba.
      Particioné por par pregunta-respuesta y no por participante, así que hay fuga
      por grupo. Y evalué a nivel turno en vez de a nivel paciente, que es la unidad
      clínica que de verdad importa. El F1 de 0.7744 hay que leerlo con eso encima.
      Lo que me dejó es que la validación se diseña antes del experimento, no
      después, y que un número que no puedes defender es peor que no tener número.
      Por eso hoy, cuando evalúo sistemas generativos, la suite se ancla en modos
      de falla reales de producción y no en casos sintéticos que yo mismo inventé.
  - pregunta: "¿Qué no sabes hacer?"
    respuesta: >
      Varias cosas, y prefiero decirlas antes de que salgan. No he escrito .NET ni
      C#, ni Rust. No he usado PySpark, Databricks ni Airflow; mi cómputo
      distribuido ha sido con BigQuery. No he construido agentes de voz, todo mi
      trabajo conversacional ha sido en texto. Y no he hecho un ejercicio formal
      de red team contra mis propios agentes, que es una brecha que tengo clara.
  - pregunta: "¿Cómo se supervisa lo que hacen tus agentes?"
    respuesta: >
      Con tres capas, y la tercera es la que casi nadie construye. La primera es
      técnica: validación de salida que bloquea respuestas no sustentadas en el
      resultado de una herramienta, más agentes revisores que auditan antes de
      que la respuesta llegue al cliente. La segunda es de ingeniería: trazado de
      cada llamada y una suite de evaluación que corre ante cada cambio. La
      tercera es humana: construí las plataformas web donde una persona del
      negocio revisa, valida, aprueba y corrige lo que el agente produce. Son
      mini CRMs por línea de negocio. Sin esa capa un agente puede funcionar,
      pero nadie fuera de ingeniería puede responder por él.
  - pregunta: "¿Puedes darme detalles del negocio donde trabajas?"
    respuesta: >
      Puedo hablar de arquitectura, decisiones técnicas y de cómo resolví los
      problemas, pero no de clientes, marcas socias, cifras de negocio ni nombres
      de sistemas internos. Eso es información de mi empleador. Con gusto entro en
      el detalle técnico que necesites.

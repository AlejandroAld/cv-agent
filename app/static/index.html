<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de CV</title>
<meta name="description" content="Agente conversacional que responde sobre mi trayectoria profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15395B;
  --ink-deep:#0D2439;
  --signal:#1F7A6B;
  --surface:#FFFFFF;
  --canvas:#E9EEF2;
  --line:#CBD7E1;
  --text:#16212B;
  --muted:#5A6B7B;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--text);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.shell{
  display:grid;
  grid-template-columns:290px minmax(0,1fr);
  gap:1px;
  background:var(--line);
  height:100dvh;
  max-width:1180px;
  margin:0 auto;
  border-inline:1px solid var(--line);
}

/* ---------- columna izquierda ---------- */
.spine{
  background:var(--ink);
  color:#DCE6EE;
  padding:34px 26px;
  display:flex;
  flex-direction:column;
  gap:26px;
  overflow-y:auto;
}
.spine h1{
  font-size:1.5rem;
  line-height:1.2;
  margin:0;
  font-weight:600;
  letter-spacing:-.015em;
  color:#fff;
}
.spine .role{margin:6px 0 0;font-size:.875rem;color:#9FB6C9}
.spine p.blurb{margin:0;font-size:.875rem;color:#B9CBD9}

.starters{display:flex;flex-direction:column;gap:7px;margin-top:auto}
.starters .heading{font-size:.8125rem;color:#8EA7BC;margin-bottom:2px}
.starter{
  text-align:left;
  font:inherit;
  font-size:.84rem;
  color:#E4EDF3;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--radius);
  padding:9px 11px;
  cursor:pointer;
  transition:background .15s;
}
.starter:hover{background:rgba(255,255,255,.13)}
.starter:focus-visible{outline:2px solid #7FD8C6;outline-offset:2px}

.links{display:flex;flex-wrap:wrap;gap:14px;font-size:.8125rem;padding-top:20px;border-top:1px solid rgba(255,255,255,.14)}
.links a{color:#9FD9CC;text-decoration:none;border-bottom:1px solid transparent}
.links a:hover{border-bottom-color:#9FD9CC}

/* ---------- conversación ---------- */
.talk{background:var(--surface);display:flex;flex-direction:column;min-width:0}
.thread{flex:1;overflow-y:auto;padding:34px 38px;display:flex;flex-direction:column;gap:24px}

.turn{max-width:62ch}
.turn.mine{align-self:flex-end;max-width:48ch}
.turn.mine .body{
  background:var(--ink);
  color:#fff;
  padding:10px 14px;
  border-radius:var(--radius) var(--radius) 2px var(--radius);
  font-size:.925rem;
}
.turn.theirs .body{
  font-family:"Source Serif 4",Georgia,serif;
  font-size:1.0625rem;
  line-height:1.62;
  border-left:2px solid var(--signal);
  padding-left:17px;
  white-space:pre-wrap;
}
.turn.theirs .body strong{font-weight:600}

.dots{display:inline-flex;gap:4px;padding-left:17px;border-left:2px solid var(--signal)}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--signal);opacity:.35;animation:pulse 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}
.dots i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.95}}

.notice{
  font-size:.875rem;color:#8A4B2F;background:#FCF2EC;
  border:1px solid #EFD6C6;border-radius:var(--radius);padding:11px 14px;max-width:62ch;
}

/* ---------- composer ---------- */
.composer{border-top:1px solid var(--line);padding:16px 38px 22px;background:var(--surface)}
.field{display:flex;gap:10px;align-items:flex-end}
textarea{
  flex:1;font:inherit;font-size:.95rem;color:var(--text);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;resize:none;max-height:150px;background:#FCFDFE;
}
textarea:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px rgba(31,122,107,.14)}
button.send{
  font:inherit;font-weight:500;font-size:.9rem;color:#fff;background:var(--ink);
  border:0;border-radius:var(--radius);padding:11px 18px;cursor:pointer;transition:background .15s;
}
button.send:hover:not(:disabled){background:var(--ink-deep)}
button.send:disabled{background:#9AAEBE;cursor:not-allowed}
button.send:focus-visible,textarea:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.foot{font-size:.75rem;color:var(--muted);margin:9px 0 0}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .spine{padding:24px 20px;gap:18px}
  .starters{margin-top:4px}
  .thread{padding:22px 20px}
  .composer{padding:14px 20px 18px;position:sticky;bottom:0}
  .turn.theirs .body{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <aside class="spine">
    <div>
      <h1 id="who">Agente de CV</h1>
      <p class="role" id="role">Cargando perfil</p>
    </div>
    <p class="blurb" id="blurb">Este agente responde sobre mi trayectoria, mis proyectos y lo que sé hacer. Contesta con lo que está en mi perfil y dice cuando algo no está ahí.</p>
    <div class="starters" id="starters">
      <p class="heading">Para empezar</p>
    </div>
    <nav class="links" id="links"></nav>
  </aside>

  <section class="talk">
    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversación"></div>
    <form class="composer" id="composer">
      <div class="field">
        <label for="input" class="sr-only" style="position:absolute;left:-9999px">Tu pregunta</label>
        <textarea id="input" rows="1" placeholder="Pregunta lo que quieras sobre mi perfil" autocomplete="off"></textarea>
        <button type="submit" class="send" id="send">Enviar</button>
      </div>
      <p class="foot">Las respuestas salen de mi perfil, no de una búsqueda abierta. Enter envía, Shift+Enter salta de línea.</p>
    </form>
  </section>
</main>

<script>
const thread = document.getElementById('thread');
const input = document.getElementById('input');
const send = document.getElementById('send');
const historial = [];
let ocupado = false;

function turno(clase, texto){
  const wrap = document.createElement('div');
  wrap.className = 'turn ' + clase;
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = texto;
  wrap.appendChild(body);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return body;
}

function aviso(texto){
  const n = document.createElement('div');
  n.className = 'notice';
  n.textContent = texto;
  thread.appendChild(n);
  thread.scrollTop = thread.scrollHeight;
}

// La tarjeta de agente es la fuente única: nombre, descripción y sugerencias.
fetch('/.well-known/agent-card.json').then(r => r.json()).then(card => {
  const nombre = (card.name || '').replace(/^CV de /, '');
  if (nombre) document.getElementById('who').textContent = nombre;
  document.getElementById('role').textContent = card.description || '';
  document.title = nombre ? nombre + ' — Agente de CV' : 'Agente de CV';

  const cont = document.getElementById('starters');
  (card.promptSuggestions || []).slice(0,4).forEach(texto => {
    const b = document.createElement('button');
    b.className = 'starter';
    b.type = 'button';
    b.textContent = texto;
    b.onclick = () => { input.value = texto; enviar(); };
    cont.appendChild(b);
  });

  const nav = document.getElementById('links');
  const prov = card.provider || {};
  const salida = [];
  if (card.contact && card.contact.email) salida.push(['Correo', 'mailto:' + card.contact.email]);
  if (prov.url && prov.url.includes('linkedin')) salida.push(['LinkedIn', prov.url]);
  if (card.repositoryUrl) salida.push(['Código', card.repositoryUrl]);
  salida.forEach(([t, href]) => {
    const a = document.createElement('a');
    a.textContent = t; a.href = href;
    if (!href.startsWith('mailto')) { a.target = '_blank'; a.rel = 'noopener'; }
    nav.appendChild(a);
  });
}).catch(() => {});

async function enviar(){
  const texto = input.value.trim();
  if (!texto || ocupado) return;
  ocupado = true; send.disabled = true;
  input.value = ''; input.style.height = 'auto';

  turno('mine', texto);
  historial.push({role:'user', text:texto});

  const wrap = document.createElement('div');
  wrap.className = 'turn theirs';
  const dots = document.createElement('div');
  dots.className = 'dots';
  dots.innerHTML = '<i></i><i></i><i></i>';
  wrap.appendChild(dots);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;

  const items = historial.map(h => ({
    type:'message', role:h.role,
    content:[{type: h.role === 'assistant' ? 'output_text' : 'input_text', text:h.text}]
  }));

  let cuerpo = null, acumulado = '';
  try{
    const resp = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({input: items, stream:true})
    });

    if (resp.status === 429){
      wrap.remove();
      aviso('Llegaste al límite de mensajes por ahora. Este agente corre con mi propia cuota, así que tiene un tope. Escríbeme por correo y seguimos por ahí.');
      historial.pop();
      return;
    }
    if (!resp.ok) throw new Error('http ' + resp.status);

    const lector = resp.body.getReader();
    const dec = new TextDecoder();
    let buffer = '';

    while (true){
      const {done, value} = await lector.read();
      if (done) break;
      buffer += dec.decode(value, {stream:true});
      const bloques = buffer.split('\n\n');
      buffer = bloques.pop();

      for (const bloque of bloques){
        const linea = bloque.split('\n').find(l => l.startsWith('data:'));
        if (!linea) continue;
        const crudo = linea.slice(5).trim();
        if (crudo === '[DONE]') continue;
        let ev; try { ev = JSON.parse(crudo); } catch { continue; }

        if (ev.type === 'response.output_text.delta' && ev.delta){
          if (!cuerpo){
            dots.remove();
            cuerpo = document.createElement('div');
            cuerpo.className = 'body';
            wrap.appendChild(cuerpo);
          }
          acumulado += ev.delta;
          cuerpo.textContent = acumulado;
          thread.scrollTop = thread.scrollHeight;
        } else if (ev.type === 'error'){
          throw new Error(ev.message || 'error');
        }
      }
    }

    if (!acumulado){
      dots.remove();
      wrap.remove();
      aviso('No llegó respuesta. Vuelve a intentar en un momento.');
      historial.pop();
    } else {
      historial.push({role:'assistant', text:acumulado});
    }
  } catch(err){
    wrap.remove();
    aviso('Se cortó la conexión con el agente. Vuelve a intentar en un momento.');
    historial.pop();
  } finally {
    ocupado = false; send.disabled = false; input.focus();
  }
}

document.getElementById('composer').addEventListener('submit', e => { e.preventDefault(); enviar(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviar(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

turno('theirs', 'Hola. Soy un agente que responde sobre la trayectoria profesional de la persona que me construyó. Pregúntame por su experiencia, sus proyectos o qué tanto encaja en una vacante que traigas.');
input.focus();
</script>
</body>
</html>
